name: release
run-name: release ${{ inputs.version }}

# Started by hand: Actions > release > Run workflow, on the default branch, with the version to release. It releases
# the branch's latest commit and creates the v<version> tag when the release is published.
# A prerelease label (1.2.0-rc.1) makes a GitHub prerelease and a NuGet prerelease.
#
# Nothing is published without approval:
#   verify   the version is valid and not released yet, the run is on the default branch, and the 'nuget'
#            environment requires a reviewer (the workflow fails closed if anyone removes that protection)
#   test     the full test suite on Windows
#   build    builds and packs with no write access and no publishing credentials
#   publish  waits for a reviewer to approve the 'nuget' environment, then creates the GitHub release and pushes
#            the packages; the only job that can write to the repository or get a nuget.org key
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.2.0 or 1.2.0-rc.1'
        required: true
        type: string

permissions:
  contents: read

# One release at a time; never cancel a release half way through.
concurrency:
  group: release
  cancel-in-progress: false

env:
  RELEASE_ENVIRONMENT: nuget

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the release environment's protection rules.
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: 'Check version'
        id: version
        env:
          # Through the environment, never interpolated into the script: the input is free text.
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          version="${INPUT_VERSION#v}"
          # SemVer 2.0: MAJOR.MINOR.PATCH with an optional -prerelease label.
          if ! [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::'$INPUT_VERSION' is not <major>.<minor>.<patch>[-<prerelease>]"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A run started on a feature branch must not become a release.
      - name: 'Run is on the default branch'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]]; then
            echo "::error::Started on $GITHUB_REF; run the release workflow on $DEFAULT_BRANCH"
            exit 1
          fi

      # Each version is released once. A re-run of this run finds its own tag on the same commit and goes on.
      - name: 'Version is not released yet'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/refs/tags/$TAG" --jq .sha 2> /dev/null); then
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "::error::$TAG already exists on $commit; pick a new version"
              exit 1
            fi
            echo "$TAG already points at $GITHUB_SHA: continuing an earlier attempt."
          fi

      # The publish job's approval gate lives in the repository settings, so check here that it is still there.
      - name: 'Release environment requires a reviewer'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! reviewers=$(gh api "repos/$GITHUB_REPOSITORY/environments/$RELEASE_ENVIRONMENT" \
              --jq '[.protection_rules[]? | select(.type == "required_reviewers") | .reviewers[]?] | length'); then
            echo "::error::Could not read the '$RELEASE_ENVIRONMENT' environment. Create it in Settings > Environments and add a required reviewer."
            exit 1
          fi
          if [[ "$reviewers" -lt 1 ]]; then
            echo "::error::The '$RELEASE_ENVIRONMENT' environment has no required reviewers. Add one in Settings > Environments so every release is approved by hand."
            exit 1
          fi
          echo "'$RELEASE_ENVIRONMENT' requires approval from $reviewers reviewer(s)."

  # .NET Framework tests only run on Windows; this job runs every test framework there.
  test:
    name: test (windows-latest)
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: 'Configure git credentials'
        run: |
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions

      - name: 'Test: net472, net8.0, net11.0'
        run: dotnet test --solution Source/GitSnapshotter.slnx --configuration Release --treenode-filter "/*/*/*/*[Category!=Discovery]"

  # Read-only and without publishing credentials: the code being built cannot reach them.
  build:
    name: build
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # The tests also run on .NET 8, the oldest runtime the library supports.
          dotnet-version: '8.0.x'

      - name: 'Configure git credentials'
        run: |
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions

      # Builds, tests and packs with the release version. No API key, so the pipeline does not push.
      - name: 'Run: pipeline'
        env:
          Build__DefaultBranch: ${{ github.event.repository.default_branch }}
          Build__Version: ${{ needs.verify.outputs.version }}
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      - name: 'Assemble release assets'
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          mkdir release
          cp publish/*.nupkg release/
          # Both packages (GitSnapshotter, GitSnapshotter.Tool) and the console app share the publish directory;
          # zip the console app without the packages.
          (cd publish && zip -r -q "../release/GitSnapshotter.Console_${VERSION}.zip" . -x '*.nupkg')
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -l release

      - uses: actions/upload-artifact@v7
        with:
          name: GitSnapshotter_${{ needs.verify.outputs.version }}
          path: release
          if-no-files-found: error

  publish:
    name: publish
    needs: [verify, build]
    runs-on: ubuntu-latest
    # Waits for a required reviewer (enforced by the verify job). If the nuget.org trusted publishing policy names
    # an environment, it must be this one.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/GitSnapshotter/${{ needs.verify.outputs.version }}
    permissions:
      # Creates the GitHub release and uploads its assets.
      contents: write
      # Trusted publishing: NuGet/login exchanges the workflow's OIDC token for a short-lived nuget.org API key.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    # No checkout: this job only publishes the files the build job produced.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GitSnapshotter_${{ needs.verify.outputs.version }}
          path: release

      - name: 'Verify checksums'
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      # A draft first: if the NuGet push fails, nothing is public yet and the run can be retried. A draft has no git
      # tag yet; GitHub creates the tag on the released commit when the release is published.
      - name: 'Create draft GitHub release'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A draft left behind by a failed run (verify rejects a published one): point it at this commit and
            # refresh its assets.
            gh release edit "$TAG" --target "$GITHUB_SHA"
            gh release upload "$TAG" release/* --clobber
          else
            flags=(--draft --target "$GITHUB_SHA" --generate-notes --title "$TAG")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" release/*
          fi

      # Right before the push: the key it returns is short-lived. Needs a trusted publishing policy on nuget.org
      # for this repository and workflow file (release.yml), owned by this user.
      - name: 'Log in to nuget.org (trusted publishing)'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: bus1hero

      - name: 'Push packages to nuget.org'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: 'Publish GitHub release'
        run: |
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$TAG" --draft=false --latest="$latest"
