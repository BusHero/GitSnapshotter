name: build

on:
  push:
    paths:
      - 'Source/**'
      - 'pipeline/**'
      - '.github/workflows/**'
      - 'global.json'
      - 'build.sh'
      - 'build.cmd'

jobs:
  ubuntu-latest:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}
      
      - name: 'Configure git credentials'
        run: |
          git config --global user.email github-actions@github.com
          git config --global user.name github-actions
      
      - name: 'Run: pipeline'
        id: pipeline
        env:
          Build__DefaultBranch: ${{ github.event.repository.default_branch }}
          Build__NuGetApiKey: ${{ secrets.GITHUB_TOKEN }}
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      - uses: actions/upload-artifact@v4
        with:
          name: GitSnapshotter.Console_${{ steps.pipeline.outputs.version }}
          path: publish