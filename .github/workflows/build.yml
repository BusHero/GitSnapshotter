name: Build and release
# Releases are named after their version. Otherwise the name is empty, so GitHub uses its default: the first line of
# the commit message on a push. (head_commit.message would be the whole message, body and all, on one line.)
run-name: ${{ inputs.version && format('release {0}', inputs.version) || '' }}

# One workflow for CI builds and releases. The work is done by the build pipeline (pipeline/GitSnapshotter.Pipeline);
# each job sets up the machine, runs one pipeline target (Build__Target) and hands files to the next job.
#
# CI build: every push to a branch that touches the code, or Run workflow with no version. Tests on Windows, runs the
# pipeline on Linux, uploads the console app and the packages as artifacts, and pushes prerelease packages to GitHub
# Packages.
#
# Release: Actions > Build and release > Run workflow, on the default branch, with the version to release (1.2.0, or 1.2.0-rc.1
# for a prerelease). The same jobs build with that version, then:
#   verify   (Check release) checks first that the version is valid and not released yet, the run is on the default branch, and the
#            'nuget' environment requires a reviewer (the workflow fails closed if anyone removes that protection),
#            and takes the release description from CHANGELOG.md (VerifyRelease target)
#   publish  (Publish release) waits for a reviewer to approve the 'nuget' environment, then creates the GitHub release (and its
#            v<version> tag) with every artifact and pushes the packages to nuget.org; the only job that can write
#            to the repository or get a nuget.org key. It stays in this file: it never checks out or runs the
#            repository's code, so nothing built from the repository can reach its credentials.
#   smoke-test  (Smoke test) on Linux, Windows and macOS, downloads the published packages from nuget.org as a user would: installs
#            and runs the tool, runs an app that uses the library on each framework it supports, checks the packages'
#            third-party notices and contents, what nuget.org shows about them, their symbols on nuget.org's symbol
#            server, and that they, the symbols and the console app zip are the GitHub release's and were built from
#            the released commit (SmokeTest target). Read-only: it gets no credentials beyond reading the repository.
on:
  push:
    branches: ['**']
    paths:
      - 'Source/**'
      - 'pipeline/**'
      - '.github/workflows/**'
      - 'global.json'
      - 'Directory.Build.props'
      - 'Directory.Build.targets'
      - 'Directory.Packages.props'
      - 'build.sh'
      - 'build.cmd'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.2.0 or 1.2.0-rc.1. Leave empty for a CI build.'
        required: false
        type: string

# Least privilege by default; jobs that need more ask for it explicitly.
permissions:
  contents: read

# One release at a time, never cancelled half way through; CI builds are not limited.
concurrency:
  group: ${{ inputs.version && 'release' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  # Decides whether this run is a release; on a release, checks it may go ahead before anything is built.
  verify:
    name: Check release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the release environment's protection rules.
      actions: read
    outputs:
      release: ${{ inputs.version != '' }}
      version: ${{ steps.pipeline.outputs.version }}
      tag: ${{ steps.pipeline.outputs.tag }}
      prerelease: ${{ steps.pipeline.outputs.prerelease }}
    steps:
      - name: 'CI build'
        if: inputs.version == ''
        run: echo "No version given, so this is a CI build and nothing is released."

      - uses: actions/checkout@v7
        if: inputs.version != ''
        with:
          persist-credentials: false

      - name: 'Setup: .NET SDK from global.json'
        if: inputs.version != ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 'Cache: ~/.nuget/packages'
        if: inputs.version != ''
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/packages.lock.json') }}

      # Sets the version, tag and prerelease outputs, and writes release-notes/release-notes.md.
      - name: 'Run: pipeline (VerifyRelease)'
        if: inputs.version != ''
        id: pipeline
        env:
          Build__Target: VerifyRelease
          # Through the environment, never interpolated into a script: the input is free text.
          Build__Version: ${{ inputs.version }}
          Build__DefaultBranch: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      - uses: actions/upload-artifact@v7
        if: inputs.version != ''
        with:
          name: release-notes
          path: release-notes
          if-no-files-found: error

  # .NET Framework tests only run on Windows; this job runs every test framework there.
  test:
    name: Test on Windows
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: '8.0.x'

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/packages.lock.json') }}

      # The runtime token is only given to actions; the test platform needs it to upload its report as an artifact.
      - name: Enable Automated Test Report Artifact Upload
        uses: actions/github-script@v9
        with:
          script: |
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env['ACTIONS_RUNTIME_TOKEN']);
            core.exportVariable('ACTIONS_RESULTS_URL', process.env['ACTIONS_RESULTS_URL']);

      - name: 'Run: pipeline (Test: net472, net8.0, net11.0)'
        env:
          Build__Target: Test
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

  build:
    name: Build and package
    needs: [verify, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # CI builds push prerelease packages to GitHub Packages with GITHUB_TOKEN. Release builds get no token.
      packages: write
    steps:
      # No token left in .git/config: the code being built cannot reach the job's credentials.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # The tests also run on .NET 8, the oldest runtime the library supports.
          dotnet-version: '8.0.x'

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/packages.lock.json') }}

      # CI build: a branch prerelease, pushed to GitHub Packages. Release: the release version, not pushed here;
      # the pipeline puts the release assets (packages, console app zip, SHA256SUMS.txt) in release/, and the
      # publish job pushes them to nuget.org after approval.
      - name: 'Run: pipeline'
        id: pipeline
        env:
          Build__DefaultBranch: ${{ github.event.repository.default_branch }}
          Build__Version: ${{ needs.verify.outputs.version }}
          Build__NuGetApiKey: ${{ needs.verify.outputs.release != 'true' && secrets.GITHUB_TOKEN || '' }}
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      # PackModule and PublishConsoleModule share the publish directory; the packages (library and tool) and their
      # symbol packages get their own artifact.
      - uses: actions/upload-artifact@v7
        with:
          name: GitSnapshotter.Console_${{ steps.pipeline.outputs.version }}
          path: |
            publish
            !publish/*.nupkg
            !publish/*.snupkg

      - uses: actions/upload-artifact@v7
        with:
          name: GitSnapshotter.NuGet_${{ steps.pipeline.outputs.version }}
          path: |
            publish/*.nupkg
            publish/*.snupkg
          if-no-files-found: error
          # A .nupkg (and .snupkg) is already a zip archive.
          compression-level: 0

      - uses: actions/upload-artifact@v7
        if: needs.verify.outputs.release == 'true'
        with:
          name: GitSnapshotter_${{ needs.verify.outputs.version }}
          path: release
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [verify, build]
    if: needs.verify.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Release runs only. Waits for a required reviewer (enforced by the verify job). If the nuget.org trusted
    # publishing policy names an environment, it must be this one.
    environment:
      name: nuget
      url: https://www.nuget.org/packages/GitSnapshotter/${{ needs.verify.outputs.version }}
    permissions:
      # Creates the GitHub release and uploads its assets.
      contents: write
      # Trusted publishing: NuGet/login exchanges the workflow's OIDC token for a short-lived nuget.org API key.
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.verify.outputs.tag }}
      PRERELEASE: ${{ needs.verify.outputs.prerelease }}
    # No checkout: this job only publishes the files the build job produced.
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: GitSnapshotter_${{ needs.verify.outputs.version }}
          path: release

      # Kept out of release/: everything there is attached to the release.
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: release-notes

      - name: 'Verify checksums'
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt

      # A draft first: if the NuGet push fails, nothing is public yet and the run can be retried. A draft has no git
      # tag yet; GitHub creates the tag on the released commit when the release is published. The description is
      # the version's CHANGELOG.md section, from the verify job.
      - name: 'Create draft GitHub release'
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            # A draft left behind by a failed run (verify rejects a published one): point it at this commit and
            # refresh its description and assets.
            gh release edit "$TAG" --target "$GITHUB_SHA" --notes-file release-notes/release-notes.md
            gh release upload "$TAG" release/* --clobber
          else
            flags=(--draft --target "$GITHUB_SHA" --notes-file release-notes/release-notes.md --title "$TAG")
            if [[ "$PRERELEASE" == true ]]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}" release/*
          fi

      # Right before the push: the key it returns is short-lived. Needs a trusted publishing policy on nuget.org
      # for this repository and workflow file (build.yml), owned by this user.
      - name: 'Log in to nuget.org (trusted publishing)'
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: bus1hero

      # dotnet nuget push also pushes each package's .snupkg from the same folder to nuget.org's symbol server.
      - name: 'Push packages to nuget.org'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet nuget push "release/*.nupkg" --source https://api.nuget.org/v3/index.json --api-key "$NUGET_API_KEY" --skip-duplicate

      - name: 'Publish GitHub release'
        run: |
          latest=true
          if [[ "$PRERELEASE" == true ]]; then latest=false; fi
          gh release edit "$TAG" --draft=false --latest="$latest"

  # After publish: is the release usable from nuget.org, on every OS? Waits for nuget.org to list the packages, their
  # metadata and their symbols (it validates and indexes them for a few minutes after the push), then checks them
  # against the GitHub release's assets and the released commit.
  smoke-test:
    name: Smoke test on ${{ matrix.name }}
    needs: [verify, publish]
    strategy:
      # Every OS reports, even when one fails.
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # The library runs on .NET 8, the oldest runtime it supports, too.
          dotnet-version: '8.0.x'

      # From the published release, not this run's artifacts: what users download is what gets compared. The
      # pipeline checks them against SHA256SUMS.txt.
      - name: 'Download GitHub release assets'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: gh release download "$TAG" --dir "$RUNNER_TEMP/release"

      - name: 'Run: pipeline (SmokeTest)'
        env:
          Build__Target: SmokeTest
          Build__Version: ${{ needs.verify.outputs.version }}
          Build__SmokeTestReleaseDirectory: ${{ runner.temp }}/release
          Build__SmokeTestCommit: ${{ github.sha }}
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

  # Uploads the resolved package graph to GitHub's dependency graph (Dependabot alerts, Insights > Dependency graph).
  dependency-submission:
    name: Submit dependency graph
    # CI builds only; a release builds a commit that was already built on push.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Component Detection reads the restore output (obj/project.assets.json), which includes transitive packages.
      # dotnet run restores the pipeline; the Restore target restores the solution.
      - name: 'Run: pipeline (Restore)'
        env:
          Build__Target: Restore
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      - name: 'Submit dependencies'
        uses: advanced-security/component-detection-dependency-submission-action@v0.2.0
