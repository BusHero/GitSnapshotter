name: docs

on:
  push:
    branches: [trunk]
    paths:
      - 'docs/**'
      - 'assets/logo/**'
      - 'pipeline/**'
      - 'global.json'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'assets/logo/**'
      - 'pipeline/**'
      - 'global.json'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 'Setup: Node.js'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: 'Setup: .NET SDK from global.json'
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: 'Cache: ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/packages.lock.json') }}

      # npm ci and npm run build in docs/, into docs/dist.
      - name: 'Run: pipeline (Docs)'
        env:
          Build__Target: Docs
        run: dotnet run --project pipeline/GitSnapshotter.Pipeline --configuration Release

      - uses: actions/upload-pages-artifact@v5
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
